# Rebuilds the fine-mesh AROME historical archive per zone (public/data/analogs/*.json) and commits it.
# Optional: without these files the app downloads the archive live in the browser.
name: Build analog archive

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Start date (YYYY-MM-DD)'
        default: '2023-01-01'
      zones:
        description: 'Comma-separated zone ids (empty = all)'
        default: ''
  schedule:
    - cron: '41 3 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 pipeline/build_analog_db.py --start "${{ inputs.start || '2023-01-01' }}" --zones "${{ inputs.zones }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/analogs
          git diff --cached --quiet || git commit -m "data: refresh AROME analog archive"
          git push
