# Build + deploy to GitHub Pages. Also refreshes the Météo-France station data every 3 hours
# (the source files have no CORS headers, so they are baked into the static site).
# Publishes the built site to the `gh-pages` branch.
# One-time setup: Settings → Pages → Build and deployment → Source: "Deploy from a branch" → gh-pages / (root).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Météo-France 2020-2024 archive
        uses: actions/cache@v4
        with:
          path: .mf-cache
          key: mf-archive-2020-2024-v1
      - name: Refresh Météo-France stations
        run: python3 pipeline/fetch_meteofrance.py --cache .mf-cache
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
